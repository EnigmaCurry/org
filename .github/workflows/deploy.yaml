name: deploy

on:
  push:
    branches:
      - ox-hugo
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        
    # Cache Emacs packages in ~/.emacs.d/straight
    - name: Cache Emacs packages
      uses: actions/cache@v3
      with:
        path: ~/.emacs.d/straight
        key: emacs-packages-${{ runner.os }}-${{ hashFiles('**/straight/versions/default.el') }}
        restore-keys: |
          emacs-packages-${{ runner.os }}-

    # Cache Nix store
    - name: Cache Nix store
      uses: actions/cache@v3
      with:
        path: /nix/store
        key: nix-store-${{ runner.os }}-${{ hashFiles('shell.nix') }}
        restore-keys: |
          nix-store-${{ runner.os }}-

    # Install Emacs using Nix (via purcell/setup-emacs).
    # Authenticate Nix's github.com fetches so resolving nix-emacs-ci@HEAD uses the
    # 5000/hr authenticated rate limit instead of the 60/hr anonymous one (avoids 429).
    - uses: purcell/setup-emacs@master
      with:
        version: 29.2
      env:
        NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

    # Setup Hugo
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.123.7'
        extended: true
        
    # Build the site (from Makefile)
    - name: Build
      run: 'make'

    # Deploy to GitHub Pages
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        cname: book.rymcg.tech
        force_orphan: true

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            MESSAGE="SUCCESS in deployment"
          else
            MESSAGE="FAILURE in deployment"
          fi
          echo ${MESSAGE}
          curl --json '{"text": "'"${MESSAGE}"'"}' "$WEBHOOK_URL"
