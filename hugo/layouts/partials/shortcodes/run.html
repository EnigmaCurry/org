{{- $title := .title | default "[bash]: Run this on your workstation:" }}
{{ $code := .content }}
<div class="box run">
    <div class="label"><span class="lt">{{ $title }}</span></div>
    <button class="copy" type="button" aria-label="Copy to clipboard"><span class="ico clip"></span><span class="ico check"></span></button>
    <div class="body"><pre>{{ $code }}</pre></div>
</div>
