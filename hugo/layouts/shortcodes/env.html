{{- $shell := .Get "shell" | default "bash" -}}
<div class="box notice env">
    <div class="label">[{{ $shell }}]: Set env vars</div>
    <button class="copy" type="button" aria-label="Copy to clipboard"><span class="ico clip"></span><span class="ico check"></span></button>
    <div class="body"><pre>{{ .Inner }}</pre></div>
</div>
