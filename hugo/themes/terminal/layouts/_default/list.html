{{ define "main" }}
<h1><a class="heading-anchor" href="#">{{ .Title }}</a></h1>
{{ if .IsHome }}
{{/* oversized λ logo, centered like an image; a glyph-rain canvas comes up
     behind it a beat after the page decodes (wired in terminal.js) */}}
<div class="lambda-logo no-rain" aria-hidden="true">
  <canvas class="lambda-rain"></canvas>
  <span class="lambda-glyph">&#955;</span>
</div>
{{ end }}
{{ .Content }}
{{ end }}
