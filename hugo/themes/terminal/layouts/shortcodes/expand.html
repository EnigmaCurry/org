{{- /* Collapsible section (replaces Relearn's expand). Rendered as a framed
       .box.notice whose summary is the clickable label. */ -}}
{{- $title := .Get "title" | default (.Get 0) | default "Expand..." -}}
<details class="box notice expand">
  <summary class="label">{{ $title }}</summary>
  <div class="body">{{ .Inner }}</div>
</details>
