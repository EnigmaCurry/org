{{- /* Link button (replaces Relearn's). ox-hugo passes :href, :style, :icon;
       the icon is dropped (terminal theme uses no icon font). */ -}}
{{- $href := .Get "href" -}}
{{- $style := .Get "style" | default "default" -}}
<a class="button-link button-{{ $style }}"{{ with $href }} href="{{ . }}"{{ end }}>{{ .Inner }}</a>
